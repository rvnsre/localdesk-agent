<text x="85" y="275" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" fill="#68b9ff">Original capture path</text>
<text x="85" y="313" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="23" fill="#edf4ff">63.06 ms median  |  68.89 ms p95</text>
<rect x="60" y="360" width="815" height="105" rx="18" fill="#131d32" stroke="#253858" stroke-width="2"/>
<text x="85" y="400" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" fill="#68b9ff">Calibrated OpenCV path</text>
<text x="85" y="438" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="23" fill="#edf4ff">40.91 ms median  |  47.80 ms p95</text>
<rect x="920" y="235" width="420" height="230" rx="18" fill="#131d32" stroke="#253858" stroke-width="2"/>
<text x="945" y="281" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#78e0b5">END-TO-END TARGET</text>
<text x="945" y="348" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" fill="#edf4ff">2x faster</text>
<text x="945" y="391" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#9eafca">Not verified: local model API</text>
<text x="945" y="424" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#9eafca">was unavailable during testing.</text>
<text x="60" y="552" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" fill="#9eafca">Capture benchmark: 20 samples after 3 warmups / Windows</text>
<text x="60" y="597" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" fill="#9eafca">Raw timings and methodology: docs/benchmarks/  |  No model-speed claim</text>
