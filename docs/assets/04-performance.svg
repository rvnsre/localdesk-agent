<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<rect width="1400" height="650" fill="#0b1020"/>
<rect x="20" y="20" width="1360" height="610" rx="18" fill="#0b1020" stroke="#253858" stroke-width="2"/>
<text x="60" y="67" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#78e0b5">03 / PERFORMANCE EVIDENCE</text>
<text x="60" y="136" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="46" fill="#edf4ff">Measured, never assumed.</text>
<text x="60" y="178" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="23" fill="#9eafca">Local capture timings are separate from real model and task completion time.</text>
