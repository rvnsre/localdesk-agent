[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localdesk-agent"
version = "0.2.0"
description = "Approval-based desktop automation powered by a local AI model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "anyio>=4,<5",
    "tenacity>=9,<10",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<6",
    "pybase64>=1.4,<2",
    "xxhash>=3.5,<5",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "typer>=0.15,<1",
    "rich>=13.9,<16",
    "platformdirs>=4.3,<5",
    "diskcache>=5.6,<6",
    "filelock>=3.16,<5",
    "psutil>=6,<8",
    "packaging>=24,<27",
    "PyAutoGUI>=0.9.54",
    "Pillow>=10.0",
    "pyperclip>=1.9",
    "mss>=10.2",
    "orjson>=3.10",
    "dxcam>=0.3.0; platform_system == 'Windows'",
]

[project.scripts]
localdesk = "localdesk.cli:main"
localdesk-benchmark-screenshot = "localdesk.benchmark:main"

[tool.setuptools.packages.find]
include = ["localdesk*"]

[project.optional-dependencies]
benchmark = ["requests>=2.31,<3"]
